services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: football
      POSTGRES_USER: football
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - football_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  football_data:
