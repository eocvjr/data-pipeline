name: Football data pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: read
jobs:
  validate-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: football
          POSTGRES_USER: football
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football -d football"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://football:ci_only_password@localhost:5432/football
      - run: python -m football_pipeline.pipeline
        env:
          DATABASE_URL: postgresql://football:ci_only_password@localhost:5432/football
      - uses: actions/upload-artifact@v4
        with:
          name: football-pipeline-results
          path: data/
          retention-days: 7
